services:

  db:
    container_name: threatview-db
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_DB: threatview
      POSTGRES_USER: threatview
      POSTGRES_PASSWORD: threatview_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatview -d threatview"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    container_name: threatview-redis
    image: redis:7-alpine
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  postgres_data:
  redis_data: